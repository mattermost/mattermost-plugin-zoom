name: e2e
on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: playwright (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-server
            image: mattermost/mattermost-enterprise-edition:release-12.0
          - name: master
            image: mattermostdevelopment/mattermost-enterprise-edition:master
    env:
      CI: true
      MM_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      - name: Build plugin bundle
        run: make dist
        env:
          # Builds only for the runner's OS/arch.
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true

      - name: Install e2e dependencies
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check e2e
        working-directory: e2e/playwright
        run: npm run tsc

      - name: Start Mattermost
        working-directory: e2e/playwright
        run: npm run env:up

      - name: Run Playwright
        working-directory: e2e/playwright
        run: npm run test:ci

      - name: Collect server logs
        if: failure()
        working-directory: e2e/playwright
        run: docker compose logs mattermost > playwright-report/mattermost.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright/playwright-report
          retention-days: 14

  # Non-blocking: core CSS changes in the server image can shift the baselines too.
  visual:
    name: playwright visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CI: true
      MM_IMAGE: mattermost/mattermost-enterprise-edition:release-12.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      - name: Build plugin bundle
        run: make dist
        env:
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true

      - name: Install e2e dependencies
        working-directory: e2e/playwright
        run: npm ci

      - name: Start Mattermost
        working-directory: e2e/playwright
        run: npm run env:up

      - name: Compare screenshots
        working-directory: e2e/playwright
        run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diffs
          path: |
            e2e/playwright/playwright-report
            e2e/playwright/test-results
          retention-days: 14

  contract-drift:
    name: fake-zoom contract drift
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compare committed specs with Zoom's published OpenAPI
        working-directory: e2e/playwright
        run: npm run contract:check
